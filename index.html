      drivers: [{ id: 'd1', name: 'السائق الأول', phone: '' }],
      session: null,
      seeded: false
    };
  },

  load(){
    let raw = null;
    try { raw = localStorage.getItem(DB.KEY); } catch(e){ raw = null; }
    if (raw){
      try{
        const parsed = JSON.parse(raw);
        DB.state = DB.migrate(parsed);
      }catch(e){
        console.warn('تعذّر قراءة البيانات المحفوظة، سيتم البدء من جديد', e);
        DB.state = DB.defaults();
      }
    } else {
      DB.state = DB.defaults();
    }
    DB.applyPrefs();
    return DB.state;
  },

  migrate(d){
    const base = DB.defaults();
    const st = Object.assign({}, base, d || {});
    st.settings = DB.deepMerge(base.settings, (d && d.settings) || {});
    st.settings.store = DB.deepMerge(base.settings.store, (d && d.settings && d.settings.store) || {});
    DB.COLLECTIONS.forEach((c) => { if (!Array.isArray(st[c])) st[c] = []; });
    if (!st.counters || typeof st.counters !== 'object') st.counters = {};
    if (!st.branches || !st.branches.length) st.branches = base.branches;
    if (!st.users || !st.users.length) st.users = base.users;
    if (!st.categories || !st.categories.length) st.categories = base.categories;
    st.version = base.version;
    return st;
  },
  deepMerge(a, b){
    const out = Object.assign({}, a);
    Object.keys(b || {}).forEach((k) => {
      const v = b[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) out[k] = DB.deepMerge(a[k], v);
      else if (v !== undefined && v !== null) out[k] = v;
    });
    return out;
  },

  save(immediate){
    DB.dirty = true;
    if (immediate) return DB.flush();
    clearTimeout(DB._t);
    DB._t = setTimeout(() => DB.flush(), 350);
  },
  flush(){
    clearTimeout(DB._t);
    try{
      const st = JSON.parse(JSON.stringify(DB.state));
      st.session = null; st._ts = Date.now();
      localStorage.setItem(DB.KEY, JSON.stringify(st));
      DB.dirty = false;
      return true;
    }catch(e){
      console.error(e);
      if (UI && UI.toast) UI.toast('تعذّر الحفظ — الذاكرة ممتلئة', 'err', 'جرّب تصغير حجم الصور أو أخذ نسخة احتياطية ثم تفريغ السجلات.');
      return false;
    }
  },
  storageSize(){
    try { return (localStorage.getItem(DB.KEY) || '').length; } catch(e){ return 0; }
  },

  /* ---- وصول المجموعات ---- */
  c(name){ return DB.state[name] || (DB.state[name] = []); },
  get(name, id){ return DB.c(name).find((x) => x.id === id) || null; },
  add(name, obj, opts){
    const rec = Object.assign({ id: obj.id || U.id(name.slice(0, 3)), createdAt: U.now() }, obj);
    if (!opts || opts.branch !== false) if (!rec.branchId) rec.branchId = DB.branchId();
    DB.c(name).push(rec);
    DB.save();
    return rec;
  },
  update(name, id, patch){
    const rec = DB.get(name, id);
    if (!rec) return null;
    Object.assign(rec, patch);
    DB.save();
    return rec;
  },
  remove(name, id){
    const arr = DB.c(name); const i = arr.findIndex((x) => x.id === id);
    if (i < 0) return false;
    arr.splice(i, 1); DB.save(); return true;
  },
  find(name, fn){ return DB.c(name).filter(fn); },
  byId(name){ const m = {}; DB.c(name).forEach((x) => { m[x.id] = x; }); return m; },

  /* ---- الترقيم التسلسلي ---- */
  nextNo(key){
    const n = (DB.state.counters[key] = (DB.state.counters[key] || 0) + 1);
    DB.save();
    return n;
  },
  setNo(key, n){ DB.state.counters[key] = Math.max(DB.state.counters[key] || 0, n); DB.save(); },
  docNo(prefix, key){ return prefix + '-' + String(DB.nextNo(key)).padStart(4, '0'); },

  /* ---- الفروع ---- */
  branchId(){
    const cur = DB.state.currentBranch;
    if (cur && cur !== 'all') return cur;
    return (DB.state.branches[0] || {}).id || 'br1';
  },
  branchName(id){ const b = DB.state.branches.find((x) => x.id === id); return b ? b.name : '—'; },
  inBranch(rec){
    const cur = DB.state.currentBranch;
    if (!cur || cur === 'all') return true;
    return !rec || !rec.branchId || rec.branchId === cur;
  },

  /* ---- سجل النشاط ---- */
  log(action, target, details, level){
    const u = Auth.user();
    DB.c('audit').unshift({
      id: U.id('a'), at: U.now(), userId: u ? u.id : 'system', userName: u ? u.name : 'النظام',
      action, target: target || '', details: details || '', level: level || 'info'
    });
    const arr = DB.c('audit');
    if (arr.length > 4000) arr.length = 4000;
    DB.save();
  },

  /* ---- نسخ احتياطي ---- */
  backupJSON(){
    const st = JSON.parse(JSON.stringify(DB.state));
    st.session = null;
    return JSON.stringify({ app: 'bayti-pos', version: st.version, exportedAt: U.now(), data: st }, null, 0);
  },
  restoreJSON(text){
    const obj = JSON.parse(text);
    const data = obj && obj.data ? obj.data : obj;
    if (!data || typeof data !== 'object' || !Array.isArray(data.products)) throw new Error('ملف غير صالح');
    /* النسخة الاحتياطية لا تحمل جلسة دخول (حتى لا تنتقل بين الأجهزة)،
       لذلك نُبقي جلسة المستخدم الحالي إن كان موجوداً في البيانات المستعادة */
    const keepId = DB.state.session ? DB.state.session.userId : '';
    const next = DB.migrate(data);
    const me = keepId ? (next.users || []).find((u) => u.id === keepId && u.active !== false) : null;
    next.session = me ? { userId: me.id, at: U.now(), sid: U.id('s') } : null;
    DB.state = next;
    DB.flush();
    return { ok: true, logged: !!next.session };
  },
  reset(hard){
    const keepSettings = !hard ? DB.state.settings : null;
    const keepStore = !hard ? DB.state.settings.store : null;
    DB.state = DB.defaults();
    if (keepSettings){ DB.state.settings = keepSettings; DB.state.settings.store = keepStore; }
    DB.flush();
  },

  /* ---- تفضيلات الواجهة (محفوظة منفصلة حتى لا تُفقد مع إعادة التعيين) ---- */
  prefs(){
    try { return JSON.parse(localStorage.getItem(DB.PREF) || '{}'); } catch(e){ return {}; }
  },
  setPref(k, v){
    const p = DB.prefs(); p[k] = v;
    try { localStorage.setItem(DB.PREF, JSON.stringify(p)); } catch(e){}
  },
  applyPrefs(){
    const p = DB.prefs();
    const ui = DB.state.settings.ui;
    if (p.theme) ui.theme = p.theme;
    if (p.accent) ui.accent = p.accent;
    if (p.density) ui.density = p.density;
    if (p.fontSize) ui.fontSize = p.fontSize;
    if (p.lastRoute) DB.state._lastRoute = p.lastRoute;
  },
  syncFromStorage(e){
    if (!e || e.key !== DB.KEY || !e.newValue) return;
    try{
      const st = JSON.parse(e.newValue);
      if (st._ts && st._ts !== DB.state._ts){
        const session = DB.state.session;
        DB.state = DB.migrate(st);
        DB.state.session = session;
        if (window.App && App.refresh) App.refresh();
      }
    }catch(err){}
  },

  /* ---- بيانات تجريبية (اختياري — من شاشة الإدارة) ---- */
  seed(){ return Seed.build(); }
};

function S(){ return DB.state.settings; }
function ST(){ return DB.state.settings.store; }

/* ==================== js/03-engine.js ==================== */
/* ============================================================================
   03) محرّك الحسابات — منطق العمل الصافي (بدون DOM) قابل للاختبار
   ========================================================================== */
const Engine = {

  /* ------------------------------------------------------------------ السلع */
  marginOf(p){
    const price = Number(p.price) || 0, cost = Number(p.cost) || 0;
    if (!price) return 0;
    return ((price - cost) / price) * 100;
  },
  profitOf(p){ return (Number(p.price) || 0) - (Number(p.cost) || 0); },
  /* السعر المقترح: الهامش محسوب على سعر البيع (كل 100,000 بيع = 25,000 ربح) */
  suggestPrice(cost, marginPct){
    const m = U.clamp(Number(marginPct) || 0, 0, 95);
    const raw = (Number(cost) || 0) / (1 - m / 100);
    return U.round(raw, S().sales.roundTo || 250) || Math.round(raw);
  },
  suggestPriceMarkup(cost, markupPct){
    const raw = (Number(cost) || 0) * (1 + (Number(markupPct) || 0) / 100);
    return U.round(raw, S().sales.roundTo || 250) || Math.round(raw);
  },

  /* --------------------------------------------------------------- الفواتير */
  lineTotals(it){
    const qty = Number(it.qty) || 0;
    const price = Number(it.price) || 0;
    const cost = Number(it.cost) || 0;
    const gross = qty * price;
    const discount = Number(it.discount) || 0;
    const net = gross - discount;
    return { qty, gross, discount, net, cost: cost * qty, profit: net - cost * qty };
  },
  invoiceTotals(items, opt){
    opt = opt || {};
    const lines = (items || []).map(Engine.lineTotals);
    const subtotal = U.sum(lines, (l) => l.gross);
    const lineDiscount = U.sum(lines, (l) => l.discount);
    const afterLine = subtotal - lineDiscount;
    let discount = Number(opt.discount) || 0;
    const maxDiscountPct = Number(opt.maxDiscountPct);
    if (isFinite(maxDiscountPct) && afterLine > 0){
      const cap = afterLine * maxDiscountPct / 100;
      if (discount > cap) discount = cap;
    }
    const net = afterLine - discount;
    const taxRate = Number(opt.taxRate) || 0;
    const tax = taxRate ? U.round(net * taxRate / 100, 1) : 0;
    let total = net + tax;
    const roundTo = Number(opt.roundTo) || 0;
    if (roundTo) total = U.round(total, roundTo);
    const cost = U.sum(lines, (l) => l.cost);
    return {
      subtotal, lineDiscount, discount, tax, total: Math.max(0, total), cost,
      profit: total - tax - cost,
      margin: total > 0 ? ((total - tax - cost) / total) * 100 : 0
    };
  },
  invoiceProfit(inv){
    const cost = U.sum(inv.items || [], (it) => (Number(it.cost) || 0) * (Number(it.qty) || 0));
    const net = (Number(inv.total) || 0) - (Number(inv.tax) || 0);
    return net - cost;
  },
  activeInvoices(state, from, to){
    state = state || DB.state;
    return DB.c('invoices').filter((v) => v.status !== 'void' && Engine.inRange(v.date, from, to));
  },
  inRange(date, from, to){
    if (!date) return false;
    if (from && date < from) return false;
    if (to && date > to) return false;
    return true;
  },

  /* هل هذه الدفعة هي ثمن فاتورة نقدية/بطاقة (فتُحسب ضمن المبيعات لا ضمن التسديدات)؟ */
  isInvoiceCash(state, p){
    if (!p || !p.invoiceId) return false;
    const v = (state.invoices || []).find((x) => x.id === p.invoiceId);
    return !!v && v.method !== 'installment';
  },

  /* ----------------------------------------------------------- خطط التقسيط */
  /* يبني جدول الأقساط: توزيع عادل على مضاعفات التقريب ومجموعها = المموَّل بالضبط */
  buildPlan(opt){
    const st = S().installments;
    const total = Math.max(0, Number(opt.total) || 0);
    let down = Math.max(0, Number(opt.down) || 0);
    if (down > total) down = total;
    const financed = total - down;
    let months = Math.max(1, Math.min(360, Math.round(Number(opt.months) || 1)));
    const step = Math.max(1, Number(opt.roundTo != null ? opt.roundTo : st.roundTo) || 1);
    const dueDay = Math.min(28, Math.max(1, Number(opt.dueDay != null ? opt.dueDay : st.dueDay) || 15));
    const start = opt.startDate || U.today();

    let per = Math.floor(financed / months / step) * step;
    let unit = step;
    if (per <= 0){ per = Math.floor(financed / months); unit = 1; }
    let rem = financed - per * months;
    const bump = unit === step ? Math.floor(rem / step) : rem;   /* عدد الأقساط التي تأخذ زيادة */
    const tail = unit === step ? rem - bump * step : 0;          /* الفرق المتبقي يوضع على القسط الأخير */

    const items = [];
    for (let i = 0; i < months; i++){
      let amount = per + (i < bump ? unit : 0);
      if (i === months - 1) amount += tail;
      items.push({ no: i + 1, due: Engine.dueDate(start, i, dueDay, opt), amount, paid: 0, paidAt: '', status: 'upcoming' });
    }
    return {
      down, financed, months, dueDay, startDate: start, per, step,
      items, sum: U.sum(items, (i) => i.amount), total,
      markup: Number(opt.markup) || 0
    };
  },
  /* تاريخ استحقاق القسط رقم (index+1) */
  dueDate(startDate, index, dueDay, opt){
    const sameMonth = !!(opt && opt.firstDueSameMonth != null ? opt.firstDueSameMonth : S().installments.firstDueSameMonth);
    const d = U.parse(startDate) || new Date();
    const firstOffset = (sameMonth && d.getDate() <= dueDay) ? 0 : 1;
    return U.addMonths(U.iso(new Date(d.getFullYear(), d.getMonth(), 1)), index + firstOffset, dueDay);
  },

  installmentStatus(item, today){
    today = today || U.today();
    const paid = Number(item.paid) || 0, amount = Number(item.amount) || 0;
    if (paid >= amount && amount > 0) return 'paid';
    if (item.due < today) return 'overdue';
    if (item.due === today) return 'due';
    return 'upcoming';
  },
  planSummary(plan, today){
    today = today || U.today();
    const items = plan.items || [];
    let paid = 0, overdue = 0, overdueCount = 0, dueToday = 0, dueTodayAmt = 0, upcoming = 0, upcomingAmt = 0, paidCount = 0;
    let next = null;
    items.forEach((it) => {
      const s = Engine.installmentStatus(it, today);
      const left = Math.max(0, (Number(it.amount) || 0) - (Number(it.paid) || 0));
      it._status = s;
      paid += Number(it.paid) || 0;
      if (s === 'paid'){ paidCount++; }
      else if (s === 'overdue'){ overdue += left; overdueCount++; }
      else if (s === 'due'){ dueToday++; dueTodayAmt += left; }
      else { upcoming++; upcomingAmt += left; }
      if (s !== 'paid' && (!next || it.due < next.due)) next = it;
    });
    const total = Number(plan.total) || 0;
    const down = Number(plan.down) || 0;
    const paidAll = paid + down;
    const remaining = Math.max(0, total - paidAll);
    return {
      total, down, financed: Number(plan.financed) || (total - down),
      paid, paidAll, remaining, overdue, overdueCount, dueToday, dueTodayAmt,
      upcoming, upcomingAmt, paidCount, count: items.length, next,
      progress: total > 0 ? U.clamp((paidAll / total) * 100, 0, 100) : 0,
      closed: remaining <= 0.5
    };
  },
  /* توزيع دفعة على الأقساط (الأقدم أولاً) — يعيد خطة جديدة ولا يعدّل الأصل */
  allocate(plan, amount, today){
    today = today || U.today();
    const p = JSON.parse(JSON.stringify(plan));
    let left = Math.max(0, Number(amount) || 0);
    const allocations = [];
    p.items.forEach((it) => {
      if (left <= 0) return;
      const rem = Math.max(0, (Number(it.amount) || 0) - (Number(it.paid) || 0));
      if (rem <= 0) return;
      const take = Math.min(rem, left);
      it.paid = U.round((Number(it.paid) || 0) + take, 0.01);
      left = U.round(left - take, 0.01);
      if (it.paid >= it.amount - 0.005){ it.paidAt = today; it.status = 'paid'; }
      else it.status = 'partial';
      allocations.push({ installNo: it.no, due: it.due, amount: take });
    });
    const sum = Engine.planSummary(p, today);
    if (sum.closed) p.status = 'closed';
    return { plan: p, allocations, applied: (Number(amount) || 0) - left, leftover: left, summary: sum };
  },
  /* إعادة بناء خطة بعد تعديل فاتورة: يثبّت ما سُدّد ويعيد توزيع الباقي */
  rebuildPlan(plan, newTotal, today){
    today = today || U.today();
    const paidTotal = U.sum(plan.items || [], (i) => Number(i.paid) || 0);
    const paidDown = Number(plan.down) || 0;
    const remaining = Math.max(0, newTotal - paidDown - paidTotal);
    const paidItems = (plan.items || []).filter((i) => (Number(i.paid) || 0) > 0).map((i) => ({ ...i }));
    const rest = Engine.buildPlan({
      total: paidDown + paidTotal + remaining, down: paidDown, months: Math.max(1, (plan.items || []).length),
      dueDay: plan.dueDay, startDate: today, roundTo: plan.step
    });
    const items = paidItems.concat(rest.items.map((i, k) => ({ ...i, no: paidItems.length + k + 1 })));
    return { ...plan, total: newTotal, items, financed: newTotal - paidDown };
  },

  /* --------------------------------------------------------------- الزبائن */
  customerBalance(state, id){
    state = state || DB.state;
    const invoices = state.invoices.filter((v) => v.customerId === id && v.status !== 'void');
    const purchased = U.sum(invoices, (v) => Number(v.total) || 0);
    const paid = U.sum(state.payments.filter((p) => p.customerId === id), (p) => Number(p.amount) || 0);
    const returned = U.sum(state.returns.filter((r) => r.customerId === id), (r) => Number(r.amount) || 0);
    const plans = state.plans.filter((p) => p.customerId === id);
    let overdue = 0, dueToday = 0, remaining = 0, nextDue = null;
    plans.forEach((pl) => {
      if (pl.status === 'void') return;
      const s = Engine.planSummary(pl);
      remaining += s.remaining; overdue += s.overdue; dueToday += s.dueTodayAmt;
      if (s.next && (!nextDue || s.next.due < nextDue)) nextDue = s.next.due;
    });
    return {
      purchased, paid, returned,
      remaining: Math.max(0, purchased - paid - returned),
      debt: Math.max(0, remaining),
      overdue, overdueCount: 0, dueToday, nextDue,
      invoices: invoices.length, credit: purchased > 0 ? (paid / purchased) * 100 : 100
    };
  },
  customerStatement(state, id){
    state = state || DB.state;
    const rows = [];
    state.invoices.filter((v) => v.customerId === id && v.status !== 'void').forEach((v) => {
      rows.push({ date: v.date + ' ' + (v.time || '00:00'), type: 'فاتورة بيع', ref: v.no, debit: Number(v.total) || 0, credit: 0, note: (v.items || []).length + ' صنف' });
    });
    state.payments.filter((p) => p.customerId === id).forEach((p) => {
      rows.push({ date: p.date + ' ' + (p.time || '00:00'), type: 'تسديد', ref: p.no, debit: 0, credit: Number(p.amount) || 0, note: p.method === 'cash' ? 'نقداً' : (p.note || '') });
    });
    state.returns.filter((r) => r.customerId === id).forEach((r) => {
      rows.push({ date: r.date, type: 'مرتجع', ref: r.no, debit: 0, credit: Number(r.amount) || 0, note: r.reason || '' });
    });
    rows.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    let bal = 0;
    rows.forEach((r) => { bal += (r.debit || 0) - (r.credit || 0); r.balance = bal; });
    return { rows, opening: 0, closing: bal };
  },
  customerAggregates(state){
    state = state || DB.state;
    const map = {};
    state.customers.forEach((c) => { map[c.id] = { purchased: 0, paid: 0, remaining: 0, invoices: 0, last: '' }; });
    state.invoices.filter((v) => v.status !== 'void').forEach((v) => {
      const m = map[v.customerId]; if (!m) return;
      m.purchased += Number(v.total) || 0; m.invoices++;
      if (!m.last || v.date > m.last) m.last = v.date;
    });
    state.payments.forEach((p) => { const m = map[p.customerId]; if (m) m.paid += Number(p.amount) || 0; });
    state.returns.forEach((r) => { const m = map[r.customerId]; if (m) m.paid += Number(r.amount) || 0; });
    Object.keys(map).forEach((k) => { map[k].remaining = Math.max(0, map[k].purchased - map[k].paid); });
    return map;
  },

  /* ------------------------------------------------------------- المخزون */
  stockValue(state){
    state = state || DB.state;
    return {
      cost: U.sum(state.products, (p) => (Number(p.qty) || 0) * (Number(p.cost) || 0)),
      retail: U.sum(state.products, (p) => (Number(p.qty) || 0) * (Number(p.price) || 0)),
      units: U.sum(state.products, (p) => Number(p.qty) || 0)
    };
  },
  lowStock(state){
    state = state || DB.state;
    return state.products.filter((p) => (Number(p.qty) || 0) <= (Number(p.minQty) || 0));
  },
  outOfStock(state){ return Engine.lowStock(state).filter((p) => (Number(p.qty) || 0) <= 0); },
  reorderList(state){
    return Engine.lowStock(state).map((p) => {
      const need = Math.max(1, (Number(p.minQty) || 0) * 2 - (Number(p.qty) || 0));
      return { product: p, need, cost: need * (Number(p.cost) || 0) };
    }).sort((a, b) => b.cost - a.cost);
  },
  productSales(state, productId, from, to){
    state = state || DB.state;
    let qty = 0, revenue = 0, profit = 0, last = '';
    Engine.activeInvoices(state, from, to).forEach((v) => {
      (v.items || []).forEach((it) => {
        if (it.productId !== productId) return;
        const t = Engine.lineTotals(it);
        qty += t.qty; revenue += t.net; profit += t.profit;
        if (!last || v.date > last) last = v.date;
      });
    });
    return { qty, revenue, profit, last };
  },
  deadStock(state, days){
    state = state || DB.state;
    days = days || S().stock.deadStockDays || 90;
    const cut = U.addDays(U.today(), -days);
    return state.products.filter((p) => {
      const s = Engine.productSales(state, p.id, cut, U.today());
      return s.qty === 0 && (Number(p.qty) || 0) > 0;
    }).map((p) => {
      const lastMove = (state.stockMoves || []).filter((m) => m.productId === p.id).sort((a, b) => String(b.at).localeCompare(String(a.at)))[0];
      return { product: p, since: lastMove ? lastMove.at : p.createdAt, value: (Number(p.qty) || 0) * (Number(p.cost) || 0) };
    }).sort((a, b) => b.value - a.value);
  },
  productMovements(state, productId){
    state = state || DB.state;
    return (state.stockMoves || []).filter((m) => m.productId === productId).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  },
  priceHistory(state, productId){
    state = state || DB.state;
    return (state.priceHistory || []).filter((h) => h.productId === productId).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  },

  /* ------------------------------------------------------------ المالية */
  cashboxDay(state, date){
    state = state || DB.state;
    date = date || U.today();
    const invs = state.invoices.filter((v) => v.status !== 'void' && v.date === date);
    const cashSales = U.sum(invs.filter((v) => v.method === 'cash'), (v) => Number(v.paid) || 0);
    const cardSales = U.sum(invs.filter((v) => v.method === 'card'), (v) => Number(v.paid) || 0);
    /* الدفعات المرتبطة بفاتورة نقدية/بطاقة محسوبة ضمن المبيعات — لا تُحتسب مرتين */
    const pays = state.payments.filter((p) => p.date === date).filter((p) => !Engine.isInvoiceCash(state, p));
    const cashPayments = U.sum(pays.filter((p) => Number(p.amount) >= 0 && p.method === 'cash'), (p) => Number(p.amount) || 0);
    const otherPayments = U.sum(pays.filter((p) => p.method !== 'cash'), (p) => Number(p.amount) || 0);
    const expenses = U.sum(state.expenses.filter((e) => e.date === date), (e) => Number(e.amount) || 0);
    const supplierPaid = U.sum(state.supplierPayments.filter((e) => e.date === date), (e) => Number(e.amount) || 0);
    const returns = U.sum(state.returns.filter((r) => r.date === date), (r) => Number(r.amount) || 0);
    const manualIn = U.sum((state.cashbox || []).filter((c) => c.date === date && c.type === 'in'), (c) => Number(c.amount) || 0);
    const manualOut = U.sum((state.cashbox || []).filter((c) => c.date === date && c.type === 'out'), (c) => Number(c.amount) || 0);
    const prevCloses = state.dayCloses.filter((d) => d.date < date).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const opening = prevCloses.length ? (Number(prevCloses[0].counted) || Number(prevCloses[0].expected) || 0) : 0;
    const expected = opening + cashSales + cashPayments + manualIn - expenses - supplierPaid - returns - manualOut;
    const close = state.dayCloses.find((d) => d.date === date) || null;
    return {
      date, opening, cashSales, cardSales, cashPayments, otherPayments, expenses, supplierPaid, returns,
      manualIn, manualOut, expected, close,
      counted: close ? (Number(close.counted) || 0) : null,
      diff: close ? (Number(close.counted) || 0) - expected : null,
      closed: !!close,
      invoices: invs.length, payments: pays.length
    };
  },
  profitReport(state, from, to){
    state = state || DB.state;
    const invs = Engine.activeInvoices(state, from, to);
    const revenue = U.sum(invs, (v) => Number(v.total) || 0);
    const tax = U.sum(invs, (v) => Number(v.tax) || 0);
    const cost = U.sum(invs, (v) => U.sum(v.items || [], (it) => (Number(it.cost) || 0) * (Number(it.qty) || 0)));
    const gross = revenue - tax - cost;
    const expenses = U.sum(state.expenses.filter((e) => Engine.inRange(e.date, from, to)), (e) => Number(e.amount) || 0);
    const returned = U.sum(state.returns.filter((r) => Engine.inRange(r.date, from, to)), (r) => Number(r.amount) || 0);
    return {
      from, to, revenue, tax, cost, gross, expenses, returned,
      net: gross - expenses, margin: revenue > 0 ? ((revenue - tax - cost) / revenue) * 100 : 0,
      invoices: invs.length
    };
  },
  expensesSummary(state, from, to){
    state = state || DB.state;
    const list = state.expenses.filter((e) => Engine.inRange(e.date, from, to));
    const byCat = {};
    list.forEach((e) => { byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0); });
    const cats = Object.keys(byCat).map((k) => ({ name: k, amount: byCat[k] })).sort((a, b) => b.amount - a.amount);
    return { list, byCat, cats, total: U.sum(list, (e) => Number(e.amount) || 0) };
  },
  supplierBalance(state, supplierId){
    state = state || DB.state;
    const bought = U.sum(state.purchases.filter((p) => p.supplierId === supplierId && p.status !== 'void'), (p) => Number(p.total) || 0);
    const paid = U.sum(state.supplierPayments.filter((p) => p.supplierId === supplierId), (p) => Number(p.amount) || 0);
    return { bought, paid, remaining: Math.max(0, bought - paid) };
  },

  /* ----------------------------------------------------------- السلاسل */
  salesSeries(state, from, to, by){
    state = state || DB.state;
    by = by || 'day';
    const buckets = new Map();
    const keyOf = (d) => by === 'month' ? U.monthKey(d) : by === 'year' ? String(d).slice(0, 4) : by === 'week' ? U.startOfWeek(d) : d;
    const cur = U.parse(from), end = U.parse(to);
    if (!cur || !end) return [];
    const step = by === 'month' ? 'm' : by === 'year' ? 'y' : 'd';
    const d = new Date(cur);
    let guard = 0;
    while (d <= end && guard++ < 2000){
      const iso = U.iso(d); const k = keyOf(iso);
      if (!buckets.has(k)) buckets.set(k, { key: k, sales: 0, profit: 0, count: 0, cost: 0 });
      if (step === 'd') d.setDate(d.getDate() + 1);
      else if (step === 'm') d.setMonth(d.getMonth() + 1);
      else d.setFullYear(d.getFullYear() + 1);
    }
    Engine.activeInvoices(state, from, to).forEach((v) => {
      const k = keyOf(v.date);
      const b = buckets.get(k) || { key: k, sales: 0, profit: 0, count: 0, cost: 0 };
      b.sales += Number(v.total) || 0;
      b.profit += Engine.invoiceProfit(v);
      b.count++;
      buckets.set(k, b);
    });
    return Array.from(buckets.values()).map((b) => ({
      ...b,
      label: by === 'month' ? U.monthAr(b.key) : by === 'year' ? b.key : by === 'week' ? U.dateAr(b.key, { short: true }) : U.dateAr(b.key, { short: true, year: false })
    }));
  },
  byCategory(state, from, to){
    state = state || DB.state;
    const cats = {}; state.categories.forEach((c) => { cats[c.id] = { id: c.id, name: c.name, icon: c.icon || '📦', color: c.color || '#2563EB', sales: 0, qty: 0, profit: 0 }; });
    const pMap = DB.byId('products');
    Engine.activeInvoices(state, from, to).forEach((v) => {
      (v.items || []).forEach((it) => {
        const p = pMap[it.productId];
        const cid = (p && p.categoryId) || it.categoryId || '_';
        const t = Engine.lineTotals(it);
        if (!cats[cid]) cats[cid] = { id: cid, name: 'غير مصنّف', icon: '📦', color: '#8A94A9', sales: 0, qty: 0, profit: 0 };
        cats[cid].sales += t.net; cats[cid].qty += t.qty; cats[cid].profit += t.profit;
      });
    });
    return Object.values(cats).filter((c) => c.sales > 0).sort((a, b) => b.sales - a.sales);
  },
  topProducts(state, from, to, limit){
    state = state || DB.state;
    const map = {};
    Engine.activeInvoices(state, from, to).forEach((v) => {
      (v.items || []).forEach((it) => {
        const t = Engine.lineTotals(it);
        const k = it.productId || it.name;
        if (!map[k]) map[k] = { id: it.productId, name: it.name, code: it.code, qty: 0, sales: 0, profit: 0 };
        map[k].qty += t.qty; map[k].sales += t.net; map[k].profit += t.profit;
      });
    });
    return Object.values(map).sort((a, b) => b.sales - a.sales).slice(0, limit || 10);
  },
  topCustomers(state, from, to, limit){
    state = state || DB.state;
    const map = {};
    Engine.activeInvoices(state, from, to).forEach((v) => {
      if (!map[v.customerId]) map[v.customerId] = { id: v.customerId, sales: 0, count: 0, profit: 0 };
      map[v.customerId].sales += Number(v.total) || 0;
      map[v.customerId].count++;
      map[v.customerId].profit += Engine.invoiceProfit(v);
    });
    const cMap = DB.byId('customers');
    return Object.values(map).map((m) => ({ ...m, name: (cMap[m.id] || {}).name || 'زبون نقدي', phone: (cMap[m.id] || {}).phone || '' }))
      .sort((a, b) => b.sales - a.sales).slice(0, limit || 10);
  },
  bestDayOfWeek(state, from, to){
    const days = {};
    Engine.activeInvoices(state, from, to).forEach((v) => {
      const d = U.parse(v.date); if (!d) return;
      const k = d.getDay();
      days[k] = (days[k] || 0) + (Number(v.total) || 0);
    });
    const arr = Object.keys(days).map((k) => ({ day: U.WD[k], sales: days[k] })).sort((a, b) => b.sales - a.sales);
    return arr[0] || null;
  },

  /* ------------------------------------------------------------ المؤشرات */
  kpis(state, today){
    state = state || DB.state; today = today || U.today();
    const todayInvs = state.invoices.filter((v) => v.status !== 'void' && v.date === today);
    const sales = U.sum(todayInvs, (v) => Number(v.total) || 0);
    const gross = U.sum(todayInvs, (v) => Engine.invoiceProfit(v));
    const expenses = U.sum(state.expenses.filter((e) => e.date === today), (e) => Number(e.amount) || 0);
    const box = Engine.cashboxDay(state, today);
    const collected = box.cashSales + box.cardSales + box.cashPayments + box.otherPayments;
    let dueToday = 0, dueTodayAmt = 0, overdue = 0, overdueCount = 0, totalDebt = 0;
    state.plans.filter((p) => p.status !== 'void').forEach((pl) => {
      const s = Engine.planSummary(pl, today);
      dueToday += s.dueToday; dueTodayAmt += s.dueTodayAmt;
      overdue += s.overdue; overdueCount += s.overdueCount;
      totalDebt += s.remaining;
    });
    const low = Engine.lowStock(state).length;
    const newToday = state.customers.filter((c) => String(c.createdAt || '').slice(0, 10) === today).length;
    return {
      sales, collected, netProfit: gross - expenses, grossProfit: gross, expenses,
      dueToday, dueTodayAmt, overdue, overdueCount, totalDebt, lowStock: low,
      customers: state.customers.length, newCustomers: newToday,
      invoices: todayInvs.length, cash: box.expected, opening: box.opening
    };
  },

  /* ------------------------------------------------------------ الضمان */
  warrantyStatus(w, today){
    today = today || U.today();
    const days = U.diffDays(w.end, today);
    const alertDays = S().warranty.alertDays || 30;
    if (days < 0) return { key: 'expired', label: 'منتهي', cls: 'danger', days };
    if (days <= alertDays) return { key: 'soon', label: 'قريب الانتهاء', cls: 'warn', days };
    return { key: 'active', label: 'ساري', cls: 'ok', days };
  },
  expiringWarranties(state, days){
    state = state || DB.state; days = days || S().warranty.alertDays || 30;
    return state.warranties.filter((w) => {
      const d = U.diffDays(w.end, U.today());
      return d >= 0 && d <= days;
    }).sort((a, b) => String(a.end).localeCompare(String(b.end)));
  },

  /* --------------------------------------------------------- التنبيهات */
  alerts(state, today){
    state = state || DB.state; today = today || U.today();
    const out = [];
    const cMap = DB.byId('customers'), pMap = DB.byId('products');
    let overdue = [], dueToday = [], upcoming = [];
    state.plans.filter((p) => p.status !== 'void').forEach((pl) => {
      const s = Engine.planSummary(pl, today);
      const who = (cMap[pl.customerId] || {}).name || 'زبون';
      if (s.overdueCount) overdue.push({ plan: pl, who, count: s.overdueCount, amount: s.overdue });
      if (s.dueToday) dueToday.push({ plan: pl, who, count: s.dueToday, amount: s.dueTodayAmt });
      else if (s.next && U.diffDays(s.next.due, today) >= 0 && U.diffDays(s.next.due, today) <= 7) upcoming.push({ plan: pl, who, next: s.next, amount: Math.max(0, s.next.amount - (s.next.paid || 0)) });
    });
    overdue.sort((a, b) => b.amount - a.amount);
    if (overdue.length) out.push({ level: 'danger', icon: '🔴', title: U.plural(overdue.length, 'زبون واحد عليه قسط متأخر', 'أقساط متأخرة', 'قسطاً متأخراً'), msg: 'إجمالي المتأخر ' + U.money(U.sum(overdue, (o) => o.amount)) + ' على ' + overdue.length + ' خطة', route: 'installments', filter: 'overdue', count: U.sum(overdue, (o) => o.count) });
    if (dueToday.length) out.push({ level: 'warn', icon: '🟠', title: U.plural(dueToday.length, 'قسط مستحق اليوم', 'أقساط مستحقة اليوم', 'أقساط مستحقة اليوم'), msg: U.money(U.sum(dueToday, (d) => d.amount)) + ' — استحصال اليوم', route: 'installments', filter: 'today', count: U.sum(dueToday, (d) => d.count) });
    if (upcoming.length) out.push({ level: 'info', icon: '💳', title: U.plural(upcoming.length, 'زبون لديه دفعة قريبة', 'زبائن لديهم دفعات قريبة', 'زبوناً لديهم دفعات قريبة'), msg: 'خلال 7 أيام — ' + U.money(U.sum(upcoming, (u) => u.amount)), route: 'calendar', count: upcoming.length });

    const low = Engine.lowStock(state);
    if (low.length) out.push({ level: 'warn', icon: '📦', title: U.plural(low.length, 'منتج وصل للحد الأدنى', 'منتجات وصلت للحد الأدنى', 'منتجاً وصل للحد الأدنى'), msg: low.slice(0, 4).map((p) => p.name).join('، ') + (low.length > 4 ? '…' : ''), route: 'stock', filter: 'low', count: low.length });

    const war = Engine.expiringWarranties(state);
    if (war.length) out.push({ level: 'info', icon: '🛡️', title: U.plural(war.length, 'ضمان ينتهي خلال ' + (S().warranty.alertDays || 30) + ' يوماً', 'ضمانات تنتهي قريباً', 'ضماناً ينتهي قريباً'), msg: war.slice(0, 3).map((w) => (pMap[w.productId] || {}).name || w.serial).join('، '), route: 'warranties', filter: 'soon', count: war.length });

    const pendingMaint = state.maintenance.filter((m) => !['delivered', 'cancelled'].includes(m.status));
    if (pendingMaint.length) out.push({ level: 'info', icon: '🔧', title: U.plural(pendingMaint.length, 'طلب صيانة قيد التنفيذ', 'طلبات صيانة قيد التنفيذ', 'طلب صيانة قيد التنفيذ'), msg: 'راجع الورشة لإنهاء الطلبات المفتوحة', route: 'maintenance', count: pendingMaint.length });

    const pendingDel = state.deliveries.filter((d) => !['done', 'cancelled'].includes(d.status));
    if (pendingDel.length) out.push({ level: 'info', icon: '🚚', title: U.plural(pendingDel.length, 'توصيل معلّق', 'توصيلات معلّقة', 'توصيلاً معلّقاً'), msg: 'يحتاج جدولة أو تنفيذ', route: 'deliveries', count: pendingDel.length });

    const supDue = state.suppliers.map((s) => ({ s, b: Engine.supplierBalance(state, s.id) })).filter((x) => x.b.remaining > 0);
    if (supDue.length) out.push({ level: 'info', icon: '🏭', title: 'أرصدة موردين مستحقة', msg: U.money(U.sum(supDue, (x) => x.b.remaining)) + ' على ' + supDue.length + ' مورد', route: 'supplier-accounts', count: supDue.length });

    const todayBox = Engine.cashboxDay(state, today);
    if (!todayBox.closed) out.push({ level: 'info', icon: '🔒', title: 'اليوم لم يُغلق بعد', msg: 'الرصيد المتوقع ' + U.money(todayBox.expected), route: 'day-close', count: 0 });
    return out;
  },

  /* --------------------------------------------------- الذكاء (Insights) */
  insights(state, today){
    state = state || DB.state; today = today || U.today();
    const out = [];
    const mStart = U.startOfMonth(today), prevStart = U.addMonths(mStart, -1), prevEnd = U.addDays(mStart, -1);
    const cur = Engine.profitReport(state, mStart, today);
    const prev = Engine.profitReport(state, prevStart, prevEnd);
    const growth = prev.revenue > 0 ? ((cur.revenue - prev.revenue) / prev.revenue) * 100 : (cur.revenue > 0 ? 100 : 0);
    out.push({
      icon: growth >= 0 ? '📈' : '📉', tone: growth >= 0 ? 'ok' : 'danger',
      title: (growth >= 0 ? 'ارتفاع' : 'انخفاض') + ' المبيعات ' + U.pct(Math.abs(growth), 0) + ' عن الشهر السابق',
      text: 'مبيعات هذا الشهر ' + U.money(cur.revenue) + ' مقابل ' + U.money(prev.revenue) + ' في الشهر السابق.'
    });
    const top = Engine.topProducts(state, U.addDays(today, -30), today, 1);
    if (top.length && top[0].qty > 0) out.push({ icon: '🏆', tone: 'accent', title: 'الأكثر مبيعاً: ' + top[0].name, text: 'بيع منه ' + top[0].qty + ' قطعة خلال 30 يوماً بإيراد ' + U.money(top[0].sales) + '.' });
    const dead = Engine.deadStock(state);
    if (dead.length) out.push({ icon: '💤', tone: 'warn', title: U.plural(dead.length, 'منتج راكد', 'منتجات راكدة', 'منتجاً راكداً'), text: 'قيمة راكدة ' + U.money(U.sum(dead, (d) => d.value)) + ' — لم تُبع منذ ' + (S().stock.deadStockDays || 90) + ' يوماً. فكّر بعرض أو تخفيض.' });
    const low = Engine.lowStock(state);
    if (low.length) out.push({ icon: '🔁', tone: 'warn', title: U.plural(low.length, 'منتج يحتاج إعادة طلب', 'منتجات تحتاج إعادة طلب', 'منتجاً يحتاج إعادة طلب'), text: 'تكلفة الطلب المقترحة ' + U.money(U.sum(Engine.reorderList(state), (r) => r.cost)) + '.' });
    const tc = Engine.topCustomers(state, U.addDays(today, -90), today, 1);
    if (tc.length) out.push({ icon: '⭐', tone: 'violet', title: 'أفضل زبون: ' + tc[0].name, text: 'اشترى بـ' + U.money(tc[0].sales) + ' في ' + tc[0].count + ' فاتورة خلال 90 يوماً.' });
    const best = Engine.bestDayOfWeek(state, U.addDays(today, -60), today);
    if (best) out.push({ icon: '📅', tone: 'info', title: 'أنشط يوم: ' + best.day, text: 'أعلى مبيعات خلال 60 يوماً كانت يوم ' + best.day + ' بإجمالي ' + U.money(best.sales) + '.' });
    const exp = Engine.expensesSummary(state, mStart, today);
    if (exp.total > 0){
      const ratio = cur.revenue > 0 ? (exp.total / cur.revenue) * 100 : 100;
      const topCat = exp.cats[0];
      out.push({
        icon: '💸', tone: ratio > 25 ? 'danger' : 'info',
        title: 'المصاريف ' + U.pct(ratio, 0) + ' من المبيعات',
        text: 'إجمالي ' + U.money(exp.total) + (topCat ? ' — أكبر بند: ' + topCat.name + ' (' + U.money(topCat.amount) + ')' : '') + '. صافي الربح ' + U.money(cur.net) + '.'
      });
    }
    let overdueAmt = 0, overdueCnt = 0;
    state.plans.filter((p) => p.status !== 'void').forEach((pl) => { const s = Engine.planSummary(pl, today); overdueAmt += s.overdue; overdueCnt += s.overdueCount; });
    if (overdueCnt) out.push({ icon: '🔴', tone: 'danger', title: U.plural(overdueCnt, 'قسط متأخر', 'أقساط متأخرة', 'قسطاً متأخراً'), text: 'بمبلغ ' + U.money(overdueAmt) + ' — يُنصح بالتواصل مع الزبائن أو إيقاف البيع بالتقسيط لهم.' });
    const margin = cur.revenue > 0 ? ((cur.revenue - cur.tax - cur.cost) / cur.revenue) * 100 : 0;
    if (cur.revenue > 0) out.push({ icon: '💰', tone: margin >= (S().sales.defaultMargin || 25) - 2 ? 'ok' : 'warn', title: 'هامش الربح الفعلي ' + U.pct(margin, 1), text: 'المستهدف ' + U.pct(S().sales.defaultMargin || 25, 0) + ' — ' + (margin >= (S().sales.defaultMargin || 25) - 2 ? 'أداؤك ضمن الهدف.' : 'تحقّق من الخصومات والكلف.') });
    return out;
  }
};

/* ==================== js/04-xlsx.js ==================== */
/* ============================================================================
   04) إكسل — توليد ملفات .xlsx حقيقية (ZIP + OOXML) بدون أي مكتبة خارجية
   ========================================================================== */
const XLSX = (() => {

  /* ---------------- CRC32 ---------------- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++){
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes){
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  const enc = new TextEncoder();
  function colName(i){
    let s = ''; i++;
    while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function xml(s){
    return String(s == null ? '' : s)
      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;' }[c]));
  }
  function dosTime(d){
    d = d || new Date();
    return { t: (d.getHours() << 11) | (d.getMinutes() << 5) | (Math.floor(d.getSeconds() / 2)), d: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate() };
  }

  /* ---------------- بناء حزمة ZIP (تخزين بدون ضغط) ---------------- */
  function zip(files){
    const chunks = [], central = [];
    let offset = 0;
    const dt = dosTime();
    files.forEach((f) => {
      const nameB = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const local = new Uint8Array(30 + nameB.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);       /* UTF-8 */
      lv.setUint16(8, 0, true);            /* stored */
      lv.setUint16(10, dt.t, true);
      lv.setUint16(12, dt.d, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameB.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameB, 30);
      chunks.push(local, data);

      const cd = new Uint8Array(46 + nameB.length);
      const cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dt.t, true);
      cv.setUint16(14, dt.d, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nameB.length, true);
      cv.setUint32(42, offset, true);
      cd.set(nameB, 46);
      central.push(cd);
      offset += local.length + data.length;
    });
    const cdSize = central.reduce((t, c) => t + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    return new Blob(chunks.concat(central, [end]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  /* ---------------- أجزاء OOXML ---------------- */
  const STYLES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0"/><numFmt numFmtId="165" formatCode="yyyy-mm-dd"/></numFmts>' +
    '<fonts count="3"><font><sz val="11"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>' +
    '<font><b/><sz val="12"/><color rgb="FF172033"/><name val="Calibri"/></font></fonts>' +
    '<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF172033"/><bgColor indexed="64"/></patternFill></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FFEAF1FE"/><bgColor indexed="64"/></patternFill></fill></fills>' +
    '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>' +
    '<border><bottom style="thin"><color rgb="FFD0D7E2"/></bottom></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="6">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1"/>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1"/>' +
    '<xf numFmtId="0" fontId="2" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1"/>' +
    '<xf numFmtId="164" fontId="2" fillId="3" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  function sheetXml(sheet, index){
    const cols = sheet.columns || [];
    const rows = sheet.rows || [];
    const colsXml = '<cols>' + cols.map((c, i) =>
      '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + (c.width || 16) + '" customWidth="1"/>'
    ).join('') + '</cols>';

    let body = '<row r="1" ht="24" customHeight="1">';
    cols.forEach((c, i) => { body += '<c r="' + colName(i) + '1" s="1" t="inlineStr"><is><t>' + xml(c.title) + '</t></is></c>'; });
    body += '</row>';

    rows.forEach((r, ri) => {
      const n = ri + 2;
      body += '<row r="' + n + '">';
      cols.forEach((c, ci) => {
        const raw = r[c.key];
        const ref = colName(ci) + n;
        const isNum = (c.type === 'number' || c.type === 'money') && raw !== '' && raw != null && isFinite(Number(raw));
        if (isNum){
          body += '<c r="' + ref + '" s="' + (c.type === 'money' ? 2 : 0) + '"><v>' + Number(raw) + '</v></c>';
        } else {
          body += '<c r="' + ref + '" s="3" t="inlineStr"><is><t xml:space="preserve">' + xml(raw == null ? '' : raw) + '</t></is></c>';
        }
      });
      body += '</row>';
    });

    const lastCol = colName(Math.max(0, cols.length - 1));
    const filter = cols.length && rows.length ? '<autoFilter ref="A1:' + lastCol + (rows.length + 1) + '"/>' : '';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetViews><sheetView' + (sheet.rtl === false ? '' : ' rightToLeft="1"') + ' workbookViewId="0" showGridLines="' + (sheet.grid ? '1' : '0') + '">' +
      (sheet.freeze === false ? '' : '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/>') +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="16"/>' + colsXml +
      '<sheetData>' + body + '</sheetData>' + filter +
      '</worksheet>';
  }

  function summarySheet(sheet){
    const info = sheet.summary || [];
    const cols = [{ key: 'k', title: 'البيان', width: 30, type: 'text' }, { key: 'v', title: 'القيمة', width: 24, type: 'money' }];
    const rows = info.map((x) => ({ k: x.k, v: x.v }));
    rows.push({ k: 'تاريخ التصدير', v: U.dateTimeAr(U.now()) });
    rows.push({ k: 'المحل', v: ST().name });
    return { name: 'ملخّص', columns: cols, rows, grid: true, freeze: false };
  }

  /* ---------------- الواجهة العامة ---------------- */
  function build(sheets, opts){
    opts = opts || {};
    const list = Array.isArray(sheets) ? sheets.slice() : [sheets];
    if (opts.summary !== false && list[0] && list[0].summary) list.unshift(summarySheet(list[0]));
    const files = [];
    const overrides = [];
    list.forEach((s, i) => {
      const n = i + 1;
      files.push({ name: 'xl/worksheets/sheet' + n + '.xml', data: sheetXml(s, i) });
      overrides.push('<Override PartName="/xl/worksheets/sheet' + n + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>');
    });
    const sheetTags = list.map((s, i) => '<sheet name="' + xml(s.name || ('ورقة' + (i + 1))) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('');
    const rels = list.map((s, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('');
    const stylesId = 'rId' + (list.length + 1);

    files.push({
      name: '[Content_Types].xml',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        overrides.join('') + '</Types>'
    });
    files.push({
      name: '_rels/.rels',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>'
    });
    files.push({
      name: 'xl/workbook.xml',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<workbookPr/><sheets>' + sheetTags + '</sheets></workbook>'
    });
    files.push({
      name: 'xl/_rels/workbook.xml.rels',
      data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + rels +
        '<Relationship Id="' + stylesId + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>'
    });
    files.push({ name: 'xl/styles.xml', data: STYLES });
    return zip(files);
  }

  function download(filename, sheets, opts){
    try{
      const blob = build(sheets, opts);
      U.download(filename.replace(/\.xlsx?$/i, '') + '.xlsx', blob);
      return true;
    }catch(e){
      console.error('فشل توليد xlsx، سيتم التصدير بصيغة CSV', e);
      const first = Array.isArray(sheets) ? sheets[0] : sheets;
      const rows = (first.rows || []).map((r) => {
        const o = {}; (first.columns || []).forEach((c) => { o[c.title] = r[c.key]; }); return o;
      });
      U.download(filename.replace(/\.xlsx?$/i, '') + '.csv', U.blob(U.toCsv(rows), 'text/csv;charset=utf-8'));
      UI.toast('تم التصدير بصيغة CSV بدلاً من Excel', 'warn', 'تعذّر إنشاء ملف xlsx على هذا المتصفح.');
      return false;
    }
  }

  /* ---------------- قراءة XLSX (للاستيراد) ---------------- */
  async function inflate(bytes){
    if (typeof DecompressionStream === 'function'){
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      const buf = await new Response(stream).arrayBuffer();
      return new Uint8Array(buf);
    }
    throw new Error('المتصفح لا يدعم فك ضغط ملفات Excel');
  }

  async function parse(arrayBuffer){
    const b = new Uint8Array(arrayBuffer);
    const dv = new DataView(arrayBuffer);
    /* البحث عن نهاية الدليل المركزي */
    let eocd = -1;
    for (let i = b.length - 22; i >= 0 && i > b.length - 66000; i--){
      if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error('ملف Excel غير صالح');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const entries = {};
    for (let i = 0; i < count; i++){
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nameLen = dv.getUint16(off + 28, true);
      const extraLen = dv.getUint16(off + 30, true);
      const cmtLen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      const name = new TextDecoder().decode(b.slice(off + 46, off + 46 + nameLen));
      const lNameLen = dv.getUint16(lho + 26, true);
      const lExtraLen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lNameLen + lExtraLen;
      const raw = b.slice(start, start + csize);
      entries[name] = { method, raw };
      off += 46 + nameLen + extraLen + cmtLen;
    }
    const shared = [];
    if (entries['xl/sharedStrings.xml']){
      const txt = new TextDecoder().decode(entries['xl/sharedStrings.xml'].raw);
      txt.replace(/<si>([\s\S]*?)<\/si>/g, (m, inner) => {
        let s = '';
        inner.replace(/<t[^>]*>([\s\S]*?)<\/t>/g, (mm, t) => { s += t; return ''; });
        shared.push(s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'"));
        return '';
      });
    }
    const sheetKey = Object.keys(entries).find((k) => /^xl\/worksheets\/sheet1\.xml$/.test(k));
    if (!sheetKey) throw new Error('لا توجد ورقة عمل');
    const e = entries[sheetKey];
    const data = e.method === 8 ? await inflate(e.raw) : e.raw;
    const xmlText = new TextDecoder().decode(data);
    const rows = [];
    const rowRe = /<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;
    let rm;
    while ((rm = rowRe.exec(xmlText)) !== null){
      const cells = {};
      const cellRe = /<c r="([A-Z]+)\d+"([^>]*)>([\s\S]*?)<\/c>|<c r="([A-Z]+)\d+"([^>]*)\/>/g;
      let cm;
      while ((cm = cellRe.exec(rm[2])) !== null){
        const col = cm[1] || cm[4];
        const attrs = cm[2] || cm[5] || '';
        const inner = cm[3] || '';
        let val = '';
        const tMatch = /t="([^"]+)"/.exec(attrs);
        const type = tMatch ? tMatch[1] : 'n';
        const vMatch = /<v>([\s\S]*?)<\/v>/.exec(inner);
        const isMatch = /<t[^>]*>([\s\S]*?)<\/t>/.exec(inner);
        if (type === 'inlineStr' && isMatch) val = isMatch[1];
        else if (type === 's' && vMatch) val = shared[+vMatch[1]] || '';
        else if (vMatch) val = vMatch[1];
        cells[col] = val.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
      }
      rows.push(cells);
    }
    if (!rows.length) return [];
    const head = rows[0];
    const keys = Object.keys(head);
    return rows.slice(1).map((r) => {
      const o = {};
      keys.forEach((k) => { o[String(head[k]).trim()] = r[k] == null ? '' : String(r[k]).trim(); });
      return o;
    }).filter((o) => Object.values(o).some((v) => v !== ''));
  }

  return { build, download, parse, crc32, zip, colName, xml };
})();

    const copies = Number(d.copies) || 1;
    let out = '<div class="doc" style="width:auto;padding:0"><style>' +
      '.lbl-item{display:inline-block;width:' + dims[0] + 'mm;height:' + dims[1] + 'mm;border:1px dashed #ccc;overflow:hidden;padding:1mm;text-align:center;font-size:8px;vertical-align:top;page-break-inside:avoid;box-sizing:border-box}' +
      '.lbl-item .n{font-weight:800;font-size:8px;line-height:1.2;height:2.4em;overflow:hidden}' +
      '.lbl-item .p{font-weight:800;color:#172033;font-size:9px}' +
      '</style>';
    (d.items || []).forEach((p) => {
      for (let i = 0; i < copies; i++){
        out += '<div class="lbl-item"><div class="n">' + U.esc(p.name) + '</div>' +
          U.barcodeSvg(p.barcode || p.code, { width: dims[0] - 4, height: 8, fontSize: 6, showText: true }) +
          '<div class="p">' + U.num(p.price) + '</div></div>';
      }
    });
    return out + '</div>';
  },

  /* ------------------------------------------------------ التشغيل والمعاينة */
  setPageStyle(size, opt){
    opt = opt || {};
    const el = document.getElementById('page-style');
    if (!el) return;
    const orient = opt.orientation || S().print.orientation || 'portrait';
    const margins = opt.margins || S().print.margins || '10mm';
    const sz = size === 'A5' ? 'A5' : size === 'T80' ? '80mm auto' : size === 'T58' ? '58mm auto' : 'A4';
    const m = Print.isThermal(size) ? '2mm' : margins;
    el.textContent = '@page{ size:' + sz + ' ' + (Print.isThermal(size) ? '' : orient) + '; margin:' + m + '; }';
  },

  render(html, size, opt){
    const host = document.getElementById('print-host');
    if (!host) return;
    Print.setPageStyle(size, opt);
    host.innerHTML = html;
  },

  run(html, opt){
    opt = opt || {};
    Print.render(html, opt.size || S().print.size, opt);
    const copies = Math.max(1, Number(opt.copies || S().print.copies || 1));
    const go = () => { try { window.print(); } catch(e){ UI.toast('تعذّرت الطباعة', 'err'); } };
    setTimeout(go, 220);
    setTimeout(() => { const host = document.getElementById('print-host'); if (host) host.innerHTML = ''; }, 1600);
    void copies;
  },

  preview(html, opt){
    opt = opt || {};
    const size = opt.size || S().print.size || 'A4';
    UI.modal({
      title: '🖨️ معاينة قبل الطباعة',
      wide: true,
      body: '<div class="toolbar no-print">' +
        '<div class="btn-group" data-preview-sizes>' +
        ['A4','A5','T80','T58'].map((s) => '<button data-act="pv-size" data-size="' + s + '" class="' + (s === size ? 'on' : '') + '">' + s + '</button>').join('') +
        '</div><div class="spacer"></div>' +
        '<button class="btn sm" data-act="pv-copies">النسخ: <b id="pvCopies">' + (S().print.copies || 1) + '</b></button>' +
        '</div>' +
        '<div class="preview-frame" id="pvFrame">' + html + '</div>',
      actions: [
        { label: 'إغلاق', cls: 'ghost', act: 'close-modal' },
        { label: '🖨️ طباعة', cls: 'primary', act: 'pv-print' }
      ],
      data: { html, size }
    });
  }
};

/* ==================== js/06-ui.js ==================== */
/* ============================================================================
   06) الواجهة — نوافذ، تنبيهات، قوائم، رسوم بيانية، جداول
   ========================================================================== */
const UI = {
  _handlers: {},
  _hid: 0,
  on: (el, ev, fn, opt) => U.on(el, ev, fn, opt),
  $: (s, r) => U.$(s, r),
  $$: (s, r) => U.$$(s, r),

  /* ------------------------------------------------------------- Toasts */
  toast(title, kind, msg, ms){
    const wrap = document.getElementById('toasts');
    if (!wrap) return;
    const icons = { ok: '✅', err: '⛔', warn: '⚠️', info: 'ℹ️' };
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || 'info');
    el.innerHTML = '<div class="t-ic">' + (icons[kind] || 'ℹ️') + '</div><div class="t-b">' +
      '<div class="t-t">' + U.esc(title) + '</div>' + (msg ? '<div class="t-m">' + U.esc(msg) + '</div>' : '') + '</div>';
    wrap.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms || (kind === 'err' ? 5200 : 3200));
  },

  /* -------------------------------------------------------------- Modal */
  modal(opt){
    const root = document.getElementById('modalRoot');
    const slot = document.getElementById('modalSlot');
    const acts = opt.actions || [];
    const hid = 'm' + (++UI._hid);
    UI._handlers[hid] = acts.map((a) => a.handler || null);
    const actsHtml = acts.map((a, i) =>
      '<button class="btn ' + (a.cls || '') + '" data-act="modal-act" data-h="' + hid + '" data-i="' + i + '">' + U.esc(a.label) + '</button>'
    ).join('');
    slot.innerHTML = '<div class="modal ' + (opt.wide ? 'wide' : '') + (opt.narrow ? ' narrow' : '') + '" data-hid="' + hid + '" role="dialog" aria-modal="true">' +
      '<div class="modal-h"><h3>' + (opt.icon ? opt.icon + ' ' : '') + U.esc(opt.title || '') + '</h3>' +
      (opt.sub ? '<span class="muted small">' + U.esc(opt.sub) + '</span>' : '') +
      '<button class="btn ghost icon sm x" data-act="close-modal">✕</button></div>' +
      '<div class="modal-b">' + (opt.body || '') + '</div>' +
      (acts.length ? '<div class="modal-f">' + (opt.prependActions || '') + '<div class="spacer"></div>' + actsHtml + '</div>' : '') +
      '</div>';
    root.classList.add('on');
    document.body.style.overflow = 'hidden';
    UI.modalCtx = { root, slot, hid, data: opt.data || {}, opt };
    const first = slot.querySelector('input,select,textarea,button.primary');
    if (first) setTimeout(() => { try { first.focus(); } catch(e){} }, 60);
    if (opt.onOpen) opt.onOpen(UI.modalCtx);
    return UI.modalCtx;
  },
  closeModal(){
    const root = document.getElementById('modalRoot');
    if (root){ root.classList.remove('on'); }
    document.getElementById('modalSlot').innerHTML = '';
    document.body.style.overflow = '';
    UI.modalCtx = null;
  },
  modalAct(h, i, ev){
    const list = UI._handlers[h] || [];
    const fn = list[i];
    if (fn) fn(UI.modalCtx, ev);
  },
  confirm(title, msg, opt){
    opt = opt || {};
    return new Promise((resolve) => {
      UI.modal({
        title, icon: opt.icon || '❓', narrow: true,
        body: '<p style="margin:0">' + U.esc(msg || '') + '</p>' + (opt.html || ''),
        actions: [
          { label: 'إلغاء', cls: 'ghost', handler: (ctx) => { UI.closeModal(); resolve(false); } },
          { label: opt.okLabel || 'تأكيد', cls: opt.danger ? 'danger' : 'primary', handler: (ctx) => { UI.closeModal(); resolve(true); } }
        ]
      });
    });
  },
  /* نموذج عام داخل نافذة: fields = [{key,label,type,options,required,value,hint,min,max,step,full}] */
  form(fields, data, opt){
    opt = opt || {};
    const html = fields.map((f) => {
      const v = data && data[f.key] != null ? data[f.key] : (f.value != null ? f.value : '');
      let input = '';
      const id = 'f_' + f.key;
      if (f.type === 'select'){
        input = '<select class="select" id="' + id + '" data-k="' + f.key + '">' +
          (f.placeholder ? '<option value="">' + U.esc(f.placeholder) + '</option>' : '') +
          (f.options || []).map((o) => '<option value="' + U.attr(o.value) + '" ' + (String(o.value) === String(v) ? 'selected' : '') + '>' + U.esc(o.label) + '</option>').join('') +
          '</select>';
      } else if (f.type === 'textarea'){
        input = '<textarea class="textarea" id="' + id + '" data-k="' + f.key + '" placeholder="' + U.attr(f.placeholder || '') + '">' + U.esc(v) + '</textarea>';
      } else if (f.type === 'check'){
        input = '<label class="check"><input type="checkbox" id="' + id + '" data-k="' + f.key + '" ' + (v ? 'checked' : '') + '><span>' + U.esc(f.checkLabel || 'نعم') + '</span></label>';
      } else if (f.type === 'switch'){
        input = '<label class="switch"><input type="checkbox" id="' + id + '" data-k="' + f.key + '" ' + (v ? 'checked' : '') + '><i></i></label>';
      } else if (f.type === 'image'){
        input = '<div class="row gap-8"><div class="thumb lg" id="imgPrev_' + f.key + '">' + (v ? '<img src="' + U.esc(v) + '">' : '🖼️') + '</div>' +
          '<input type="hidden" data-k="' + f.key + '" id="' + id + '" value="' + U.attr(v) + '">' +
          '<button type="button" class="btn sm" data-act="pick-image" data-k="' + f.key + '">📷 اختيار صورة</button>' +
          (v ? '<button type="button" class="btn sm ghost" data-act="clear-image" data-k="' + f.key + '">حذف</button>' : '') + '</div>';
      } else {
        const type = f.type === 'money' || f.type === 'number' ? 'number' : f.type || 'text';
        input = '<input class="input" id="' + id + '" data-k="' + f.key + '" type="' + type + '" value="' + U.attr(v) + '"' +
          (f.placeholder ? ' placeholder="' + U.attr(f.placeholder) + '"' : '') +
          (f.required ? ' required' : '') + (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
          (f.step != null ? ' step="' + f.step + '"' : '') + (f.type === 'money' ? ' inputmode="numeric"' : '') + '>';
        if (f.type === 'money') input = '<div class="input-group">' + input + '<span class="addon">' + U.esc(S().locale.currencySymbol) + '</span></div>';
      }
      return '<div class="field ' + (f.full ? 'full' : '') + '">' +
        (f.type === 'switch' || f.type === 'check' ? '' : '<label for="' + id + '">' + U.esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>') +
        input + (f.hint ? '<span class="hint">' + U.esc(f.hint) + '</span>' : '') + '</div>';
    }).join('');
    return '<form class="form-grid" id="' + (opt.id || 'mForm') + '" onsubmit="return false">' + html + '</form>' + (opt.extra || '');
  },
  readForm(rootEl, fields){
    const out = {};
    (fields || []).forEach((f) => {
      const el = rootEl.querySelector('[data-k="' + f.key + '"]');
      if (!el) return;
      if (f.type === 'check' || f.type === 'switch') out[f.key] = !!el.checked;
      else if (f.type === 'money' || f.type === 'number') out[f.key] = el.value === '' ? 0 : Number(el.value) || 0;
      else out[f.key] = el.value;
    });
    return out;
  },
  validate(fields, data){
    const errs = [];
    fields.forEach((f) => {
      if (f.required && (data[f.key] === '' || data[f.key] == null)) errs.push(f.label);
    });
    return errs;
  },

  /* ---------------------------------------------------------- Dropdown */
  dropdown(anchor, items){
    const root = document.getElementById('ddRoot');
    const slot = document.getElementById('ddSlot');
    slot.innerHTML = items.map((it, i) => {
      if (it.sep) return '<div class="sep"></div>';
      if (it.title) return '<div class="dd-t">' + U.esc(it.title) + '</div>';
      return '<button data-act="dd-item" data-i="' + i + '" class="' + (it.danger ? 'danger' : '') + '">' +
        (it.icon ? '<span class="ic">' + it.icon + '</span>' : '') + '<span>' + U.esc(it.label) + '</span>' +
        (it.hint ? '<span class="muted tiny" style="margin-inline-start:auto">' + U.esc(it.hint) + '</span>' : '') + '</button>';
    }).join('');
    root.classList.add('on');
    root._items = items;
    const isDesktop = window.innerWidth > 640;
    if (isDesktop && anchor){
      const r = anchor.getBoundingClientRect();
      slot.style.position = 'fixed';
      slot.style.minWidth = Math.max(210, r.width) + 'px';
      const left = Math.min(window.innerWidth - 240, r.left);
      slot.style.left = Math.max(8, left) + 'px';
      const below = r.bottom + 6;
      if (below + 300 > window.innerHeight){ slot.style.top = 'auto'; slot.style.bottom = (window.innerHeight - r.top + 6) + 'px'; }
      else { slot.style.top = below + 'px'; slot.style.bottom = 'auto'; }
    } else {
      slot.style.position = ''; slot.style.left = ''; slot.style.top = ''; slot.style.bottom = ''; slot.style.minWidth = '';
    }
  },
  closeDropdown(){
    const root = document.getElementById('ddRoot');
    if (root){ root.classList.remove('on'); root._items = null; }
  },

  /* -------------------------------------------------------------- تخطيط */
  page(opt){
    return '<div class="view-in">' +
      '<div class="page-head">' +
        '<div><h1>' + (opt.icon ? opt.icon + ' ' : '') + U.esc(opt.title) + '</h1>' +
        (opt.sub ? '<div class="sub">' + opt.sub + '</div>' : '') + '</div>' +
        (opt.actions ? '<div class="page-actions">' + opt.actions + '</div>' : '') +
      '</div>' + (opt.body || '') + '</div>';
  },
  card(title, body, opt){
    opt = opt || {};
    return '<section class="card ' + (opt.cls || '') + (opt.span ? ' span-' + opt.span : '') + '">' +
      (title ? '<div class="card-h"><h3>' + (opt.icon ? opt.icon + ' ' : '') + U.esc(title) + '</h3>' +
        (opt.sub ? '<span class="sub">' + U.esc(opt.sub) + '</span>' : '') +
        (opt.acts ? '<div class="acts">' + opt.acts + '</div>' : '') + '</div>' : '') +
      body + '</section>';
  },
  empty(icon, title, sub, actionHtml){
    return '<div class="empty"><div class="e-ic">' + icon + '</div><div class="e-t">' + U.esc(title) + '</div>' +
      (sub ? '<div class="e-s">' + sub + '</div>' : '') + (actionHtml || '') + '</div>';
  },
  skeleton(n){
    let h = '';
    for (let i = 0; i < (n || 4); i++) h += '<div class="sk" style="height:38px;margin-bottom:8px"></div>';
    return h;
  },

  /* ------------------------------------------------------------- الجداول */
  table(opt){
    const cols = opt.columns || [];
    const rows = opt.rows || [];
    if (!rows.length) return opt.empty || UI.empty('🗂️', 'لا توجد بيانات', 'ابدأ بإضافة أول عنصر أو غيّر الفلاتر.');
    const head = '<tr>' + cols.map((c) => '<th class="' + (c.cls || '') + '"' + (c.width ? ' style="width:' + c.width + '"' : '') + '>' + U.esc(c.title) + '</th>').join('') + '</tr>';
    const body = rows.map((r, ri) => {
      const attrs = opt.rowAttrs ? opt.rowAttrs(r, ri) : '';
      return '<tr ' + (attrs || '') + '>' + cols.map((c) => {
        const val = c.render ? c.render(r, ri) : U.esc(r[c.key]);
        return '<td class="' + (c.cls || '') + '">' + val + '</td>';
      }).join('') + '</tr>';
    }).join('');
    const foot = opt.footer ? '<tfoot><tr>' + cols.map((c, i) => '<td class="' + (c.cls || '') + '">' + (opt.footer[i] != null ? opt.footer[i] : '') + '</td>').join('') + '</tr></tfoot>' : '';
    return '<div class="table-wrap' + (opt.wrapCls ? ' ' + opt.wrapCls : '') + '"' + (opt.maxHeight ? ' style="max-height:' + opt.maxHeight + '"' : '') + '>' +
      '<table class="tbl' + (opt.compact ? ' compact' : '') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody>' + foot + '</table></div>';
  },

  /* -------------------------------------------------------- الرسوم */
  barChart(data, opt){
    opt = opt || {};
    const W = opt.width || 720, H = opt.height || 220, pad = { t: 16, r: 8, b: 26, l: 8 };
    const max = Math.max(1, ...data.map((d) => Math.max(d.value || 0, d.value2 || 0)));
    const n = data.length || 1;
    const slot = (W - pad.l - pad.r) / n;
    const bw = Math.min(opt.barWidth || 26, slot * (opt.dual ? 0.34 : 0.6));
    const h = H - pad.t - pad.b;
    let g = '';
    for (let i = 0; i <= 3; i++){
      const y = pad.t + (h / 3) * i;
      g += '<line class="grid-l" x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '"/>';
    }
    let bars = '';
    data.forEach((d, i) => {
      const x = pad.l + slot * i + slot / 2;
      const v = Number(d.value) || 0;
      const bh = (v / max) * h;
      bars += '<rect class="bar" x="' + (x - (opt.dual ? bw + 1 : bw / 2)) + '" y="' + (pad.t + h - bh) + '" width="' + bw + '" height="' + Math.max(1, bh) + '" rx="4"><title>' +
        U.esc(d.label) + ': ' + U.num(v) + '</title></rect>';
      if (opt.dual){
        const v2 = Number(d.value2) || 0;
        const bh2 = (v2 / max) * h;
        bars += '<rect class="bar bar2" x="' + (x + 1) + '" y="' + (pad.t + h - bh2) + '" width="' + bw + '" height="' + Math.max(1, bh2) + '" rx="4"><title>' +
          U.esc(opt.label2 || '') + ' ' + U.esc(d.label) + ': ' + U.num(v2) + '</title></rect>';
      }
      bars += '<text class="lbl" x="' + x + '" y="' + (H - 8) + '" text-anchor="middle">' + U.esc(d.label) + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:' + H + 'px">' + g + bars + '</svg>';
  },
  lineChart(data, opt){
    opt = opt || {};
    const W = opt.width || 720, H = opt.height || 220, pad = { t: 16, r: 10, b: 26, l: 10 };
    const vals = data.map((d) => Number(d.value) || 0);
    const max = Math.max(1, ...vals);
    const n = Math.max(1, data.length - 1);
    const h = H - pad.t - pad.b;
    const stepX = (W - pad.l - pad.r) / n;
    const pts = data.map((d, i) => [pad.l + stepX * i, pad.t + h - ((Number(d.value) || 0) / max) * h]);
    let grid = '';
    for (let i = 0; i <= 3; i++){ const y = pad.t + (h / 3) * i; grid += '<line class="grid-l" x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '"/>'; }
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = line + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (pad.t + h) + ' L' + pts[0][0].toFixed(1) + ' ' + (pad.t + h) + ' Z';
    const dots = pts.map((p, i) => '<circle class="pt" cx="' + p[0] + '" cy="' + p[1] + '" r="3"><title>' + U.esc(data[i].label) + ': ' + U.num(data[i].value) + '</title></circle>').join('');
    const every = Math.ceil(data.length / 8);
    const labels = data.map((d, i) => (i % every === 0 ? '<text class="lbl" x="' + pts[i][0] + '" y="' + (H - 8) + '" text-anchor="middle">' + U.esc(d.label) + '</text>' : '')).join('');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px"><defs><linearGradient id="gAr" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>' + dots + labels + '</svg>';
  },
  donut(items, opt){
    opt = opt || {};
    const total = U.sum(items, (i) => i.value) || 1;
    const R = 54, C = 2 * Math.PI * R;
    let off = 0;
    const rings = items.map((it) => {
      const frac = (Number(it.value) || 0) / total;
      const seg = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + it.color + '" stroke-width="22" stroke-dasharray="' +
        (frac * C).toFixed(2) + ' ' + (C - frac * C).toFixed(2) + '" stroke-dashoffset="' + (-off * C).toFixed(2) + '" transform="rotate(-90 70 70)"><title>' +
        U.esc(it.name) + ': ' + U.num(it.value) + ' (' + U.pct(frac * 100, 0) + ')</title></circle>';
      off += frac;
      return seg;
    }).join('');
    const legend = '<div class="legend">' + items.map((it) =>
      '<div class="lg-i"><span class="lg-c" style="background:' + it.color + '"></span><span>' + U.esc(it.name) + '</span>' +
      '<span class="lg-v">' + U.shortMoney(it.value) + '</span></div>').join('') + '</div>';
    return '<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140">' + rings +
      '<text x="70" y="66" text-anchor="middle" class="val" style="font-size:13px;font-weight:800">' + U.shortMoney(total) + '</text>' +
      '<text x="70" y="84" text-anchor="middle" class="lbl" style="font-size:9px">الإجمالي</text></svg>' + legend + '</div>';
  },
  sparkline(values, color){
    const W = 120, H = 34;
    const max = Math.max(1, ...values), n = Math.max(1, values.length - 1);
    const pts = values.map((v, i) => [(i / n) * W, H - (v / max) * (H - 4) - 2]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + (color || 'var(--accent)') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  },

  /* ------------------------------------------------------ أرقام متحركة */
  animateNumbers(root){
    U.$$('[data-count]', root || document).forEach((el) => {
      const to = Number(el.getAttribute('data-count')) || 0;
      const dec = Number(el.getAttribute('data-dec')) || 0;
      const prefix = el.getAttribute('data-prefix') || '';
      const suffix = el.getAttribute('data-suffix') || '';
      const dur = 700; const t0 = performance.now();
      const tick = (t) => {
        const p = U.clamp((t - t0) / dur, 0, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = prefix + U.num(to * eased, dec) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  },

  /* --------------------------------------------------------- مؤشرات */
  statusBadge(status){
    const map = {
      paid: ['ok', 'مسدّد'], overdue: ['danger', 'متأخر'], due: ['warn', 'مستحق اليوم'], upcoming: ['info', 'قادم'],
      partial: ['warn', 'جزئي'], active: ['ok', 'نشط'], closed: ['accent', 'مغلق'], suspended: ['warn', 'موقوف'],
      void: ['danger', 'ملغاة'], returned: ['warn', 'مرتجعة'], draft: ['info', 'مسودة'], sent: ['info', 'مُرسل'],
      accepted: ['ok', 'مقبول'], rejected: ['danger', 'مرفوض'], new: ['info', 'جديد'], scheduled: ['info', 'مجدول'],
      onway: ['warn', 'بالطريق'], done: ['ok', 'منجز'], delivered: ['ok', 'تم التسليم'], cancelled: ['danger', 'ملغى'],
      received: ['info', 'استلام'], inspecting: ['warn', 'فحص'], repairing: ['warn', 'إصلاح'], ready: ['ok', 'جاهز'],
      waiting: ['info', 'بانتظار قطعة'], vip: ['violet', 'VIP'], normal: ['info', 'عادي'], expired: ['danger', 'منتهي'],
      soon: ['warn', 'قريب الانتهاء'], pending: ['warn', 'قيد الانتظار'], paid_full: ['ok', 'مسدد بالكامل']
    };
    const m = map[status] || ['', status || '—'];
    return '<span class="badge ' + m[0] + '"><span class="d"></span>' + U.esc(m[1]) + '</span>';
  },
  moneyCell(v, cls){
    const n = Number(v) || 0;
    const c = cls || (n < 0 ? 'danger' : n > 0 ? '' : 'dim');
    return '<span class="num" ' + (c ? 'style="color:var(--' + c + ')";font-weight:700' : '') + '>' + U.money(n) + '</span>';
  },
  progress(pct, cls){
    return '<div class="progress ' + (cls || '') + '"><i style="width:' + U.clamp(pct, 0, 100).toFixed(1) + '%"></i></div>';
  }
};

const ROLE_PERMS = {
  admin: null, /* كل شيء */
  sales: ['dashboard','alerts','tasks','calendar','pos','sales','quotes','reservations','returns','customers','installments','payments','deliveries','print','act.discount','act.delete'],
  accountant: ['dashboard','alerts','tasks','calendar','customers','installments','payments','statements','cashbox','expenses','profits','dayclose','reports','excel','print','insights','act.cost'],
